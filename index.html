<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Tablero de Tickets — Sector Moldeo</title>
<style>
  :root{
    --bg:#15191D;
    --panel:#1E242A;
    --panel-2:#242B32;
    --line:#2C343C;
    --text:#EDEFF2;
    --text-dim:#8A94A6;
    --accent:#2FA6A6;
    --urgente:#E5484D;
    --alta:#F2994A;
    --media:#E8C547;
    --baja:#5B8DB8;
    --estado-pendiente:#8A94A6;
    --estado-curso:#2FA6A6;
    --estado-terminada:#4CAF6D;
    --estado-pausada:#D9A441;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    min-height:100vh;
  }
  .mono{ font-family:'Consolas','SF Mono',Menlo,monospace; letter-spacing:0.02em; }
  .display{ font-family:'Arial Narrow',-apple-system,'Segoe UI',sans-serif; font-weight:800; letter-spacing:0.01em; }

  /* ---------- HEADER (board) ---------- */
  .board-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px;
    border-bottom:3px solid var(--accent);
    background:linear-gradient(180deg, var(--panel), var(--bg));
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-dot{ width:14px; height:14px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent); flex-shrink:0; }
  .brand-title{ font-size:26px; text-transform:uppercase; }
  .brand-sub{ font-size:13px; color:var(--text-dim); margin-top:2px; }
  .clock{ text-align:right; }
  .clock-time{ font-size:30px; }
  .clock-date{ font-size:13px; color:var(--text-dim); text-transform:capitalize; }

  .counts-strip{
    display:flex; gap:10px; flex-wrap:wrap;
    padding:14px 28px; background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .count-pill{
    display:flex; align-items:center; gap:8px;
    padding:8px 16px; border-radius:8px; background:var(--panel-2);
    font-size:15px; font-weight:600;
  }
  .count-pill .sw{ width:10px; height:10px; border-radius:2px; }
  .count-num{ font-size:18px; }

  /* ---------- BOARD LIST ---------- */
  .board-main{ padding:20px 28px 40px; }
  .empty-state{
    text-align:center; color:var(--text-dim); padding:80px 20px; font-size:18px;
  }
  .empty-state .big{ font-size:44px; margin-bottom:10px; }

  .ticket-card{
    display:flex; align-items:stretch;
    background:var(--panel); border-radius:10px; margin-bottom:14px;
    overflow:hidden; border:1px solid var(--line);
  }
  .prio-bar{ width:12px; flex-shrink:0; }
  .ticket-body{ flex:1; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .ticket-main{ min-width:240px; }
  .ticket-sector{ font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:4px; }
  .ticket-title{ font-size:22px; font-weight:700; line-height:1.25; }
  .ticket-detalle{ font-size:14px; color:var(--text-dim); margin-top:4px; max-width:520px; }
  .ticket-right{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .badge{
    padding:6px 14px; border-radius:20px; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    white-space:nowrap;
  }
  .elapsed{ font-size:13px; color:var(--text-dim); white-space:nowrap; }

  .done-strip{
    margin-top:28px; padding-top:16px; border-top:1px dashed var(--line);
  }
  .done-strip h3{ font-size:13px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin:0 0 10px; font-weight:600; }
  .done-item{ font-size:14px; color:var(--text-dim); padding:4px 0; }
  .done-item b{ color:var(--text); font-weight:600; }

  .sync-note{
    position:fixed; bottom:12px; right:16px; font-size:11px; color:var(--text-dim);
    background:rgba(0,0,0,0.3); padding:5px 10px; border-radius:6px;
  }

  /* ---------- MODE SWITCH (subtle) ---------- */
  .mode-link{
    position:fixed; bottom:10px; left:14px; font-size:11px; color:var(--line);
    text-decoration:none; opacity:0.4; padding:6px;
  }
  .mode-link:hover{ opacity:1; color:var(--text-dim); }

  /* ---------- LOGIN ---------- */
  .login-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-card{
    width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:32px 28px; text-align:center;
  }
  .login-dot{ width:16px; height:16px; border-radius:50%; background:var(--accent); box-shadow:0 0 14px var(--accent); margin:0 auto 16px; }
  .login-card h1{ font-size:19px; margin:0 0 4px; }
  .login-card .sub{ font-size:13px; color:var(--text-dim); margin-bottom:26px; }
  .login-card label{ text-align:left; }
  .login-card input{ margin-bottom:14px; }
  .login-error{ color:var(--urgente); font-size:13px; min-height:18px; margin-bottom:6px; }
  .login-card .btn{ width:100%; padding:12px; font-size:15px; }
  .logout-link{
    position:fixed; top:14px; right:18px; font-size:12px; color:var(--text-dim);
    text-decoration:none; opacity:0.6; padding:6px 10px; border:1px solid var(--line); border-radius:6px;
  }
  .logout-link:hover{ opacity:1; color:var(--text); border-color:var(--text-dim); }

  /* ---------- ADMIN VIEW ---------- */
  .admin-wrap{ max-width:900px; margin:0 auto; padding:24px 20px 60px; }
  .admin-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
  .admin-header h1{ font-size:22px; margin:0; }
  .back-link{ color:var(--accent); font-size:13px; text-decoration:none; }
  .back-link:hover{ text-decoration:underline; }

  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:24px; }
  .panel h2{ font-size:15px; margin:0 0 16px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-dim); }

  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .form-grid .full{ grid-column:1 / -1; }
  label{ font-size:12px; color:var(--text-dim); display:block; margin-bottom:5px; text-transform:uppercase; letter-spacing:0.03em; }
  input[type=text], textarea, select{
    width:100%; padding:10px 12px; background:var(--panel-2); border:1px solid var(--line);
    border-radius:6px; color:var(--text); font-size:15px; font-family:inherit;
  }
  input[type=text]:focus, textarea:focus, select:focus{ outline:2px solid var(--accent); border-color:var(--accent); }
  textarea{ resize:vertical; min-height:60px; }

  .btn{
    padding:10px 18px; border-radius:6px; border:none; font-size:14px; font-weight:700;
    cursor:pointer; text-transform:uppercase; letter-spacing:0.03em;
  }
  .btn-primary{ background:var(--accent); color:#0B1013; }
  .btn-primary:hover{ background:#3ABFBF; }
  .btn-ghost{ background:transparent; color:var(--text-dim); border:1px solid var(--line); }
  .btn-ghost:hover{ color:var(--text); border-color:var(--text-dim); }
  .btn-danger{ background:transparent; color:var(--urgente); border:1px solid var(--urgente); }
  .btn-danger:hover{ background:var(--urgente); color:#fff; }
  .btn-row{ margin-top:14px; display:flex; gap:10px; justify-content:flex-end; }

  .admin-ticket{
    display:grid; grid-template-columns:14px 1fr auto; gap:14px; align-items:center;
    padding:12px 14px; border:1px solid var(--line); border-radius:8px; margin-bottom:10px; background:var(--panel-2);
  }
  .admin-ticket .bar{ align-self:stretch; border-radius:3px; }
  .admin-ticket-info .t{ font-weight:700; font-size:16px; }
  .admin-ticket-info .s{ font-size:12px; color:var(--text-dim); text-transform:uppercase; }
  .admin-controls{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .admin-controls select{ width:auto; padding:6px 8px; font-size:12px; }
  .icon-btn{
    background:transparent; border:1px solid var(--line); color:var(--text-dim); border-radius:6px;
    padding:6px 10px; font-size:12px; cursor:pointer;
  }
  .icon-btn:hover{ color:var(--text); border-color:var(--text-dim); }

  .toggle-row{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim); margin-top:10px;}
  .toggle-row input{ width:auto; }

  @media (max-width:700px){
    .form-grid{ grid-template-columns:1fr; }
    .board-header{ padding:14px 16px; }
    .brand-title{ font-size:20px; }
    .clock-time{ font-size:22px; }
    .board-main{ padding:14px 16px; }
    .ticket-title{ font-size:19px; }
  }
  .board-btn{
    padding:12px 20px; border-radius:8px; border:none; font-size:14px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.03em; cursor:pointer; white-space:nowrap;
  }
  .board-btn-start{ background:var(--accent); color:#0B1013; }
  .board-btn-start:active{ background:#3ABFBF; }
  .board-btn-done{ background:var(--estado-terminada); color:#0B1013; }
  .board-btn-done:active{ background:#5FC584; }
  .admin-nav{ display:flex; align-items:center; gap:8px; }
  .admin-nav label{ font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.03em; margin:0; }
  .admin-nav select{
    width:auto; padding:8px 12px; background:var(--panel-2); border:1px solid var(--line);
    border-radius:6px; color:var(--text); font-size:14px; font-weight:600; cursor:pointer;
  }
  .admin-ticket-editing{ align-items:stretch; }
  .admin-ticket-editform{ display:flex; flex-direction:column; gap:6px; }
  .admin-ticket-editform input, .admin-ticket-editform select, .admin-ticket-editform textarea{
    width:100%; padding:7px 9px; background:var(--panel); border:1px solid var(--line);
    border-radius:5px; color:var(--text); font-size:13px; font-family:inherit;
  }
  .admin-ticket-editform textarea{ min-height:44px; resize:vertical; }
  .icon-btn-save{ color:var(--estado-terminada); border-color:var(--estado-terminada); }
  .icon-btn-save:hover{ background:var(--estado-terminada); color:#0B1013; }
  .board-table-wrap{ overflow-x:auto; border-radius:10px; border:1px solid var(--line); background:var(--panel); }
  .board-table{ width:100%; border-collapse:collapse; }
  .board-table th{
    text-align:left; padding:12px 16px; font-size:12px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--text-dim); background:var(--panel-2); border-bottom:1px solid var(--line); white-space:nowrap;
  }
  .board-table td{
    padding:14px 16px; border-bottom:1px solid var(--line); font-size:16px; vertical-align:middle;
  }
  .board-table tbody tr:last-child td{ border-bottom:none; }
  .board-table td.col-bar{ width:6px; padding:0; }
  .board-table th.col-bar{ width:6px; padding:0; background:transparent; border-bottom:none; }
  .board-table td.sector-cell{ font-size:13px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; white-space:nowrap; }
  .board-table td.tarea-cell{ font-weight:700; }
  .board-table td.detalle-cell{ color:var(--text-dim); font-size:14px; max-width:260px; }
  .board-table td.tiempo-cell{ font-size:13px; white-space:nowrap; }
  .board-table td.actions-cell{ white-space:nowrap; text-align:right; }
  .board-table .mini-attrib{ font-size:12px; color:var(--text-dim); margin-top:3px; }
  .board-table-compact td{ padding:10px 16px; font-size:14px; }
  .board-table-compact .tarea-cell{ font-weight:600; }
  .activado-cell{ white-space:nowrap; }
  .activado-fecha{ font-size:14px; }
  .activado-dias{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .board-btn-pause{ background:var(--estado-pausada); color:#0B1013; }
  .board-btn-pause:active{ background:#E8B65C; }
  .board-btn-resume{ background:var(--accent); color:#0B1013; }
  .board-btn-resume:active{ background:#3ABFBF; }
  .counts-strip{ justify-content:space-between; }
  .filter-toggle-btn{
    padding:8px 16px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text-dim); font-size:13px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.03em; cursor:pointer;
  }
  .filter-toggle-btn.active{ background:var(--accent); color:#0B1013; border-color:var(--accent); }
  .board-table td.creador-cell, .board-table td.asignado-cell{ font-size:13px; color:var(--text-dim); white-space:nowrap; }
  .board-logo{ height:42px; width:auto; display:block; border-radius:6px; }
  .board-header-right{ display:flex; align-items:center; gap:14px; }
  .board-nav{ display:flex; align-items:center; gap:8px; }
  .board-nav label{ font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.03em; }
  .board-nav select{
    padding:8px 12px; background:var(--panel-2); border:1px solid var(--line);
    border-radius:6px; color:var(--text); font-size:14px; font-weight:600; cursor:pointer;
  }
  .logout-link-inline{
    font-size:13px; color:var(--text-dim); text-decoration:none; padding:8px 14px;
    border:1px solid var(--line); border-radius:6px; white-space:nowrap;
  }
  .logout-link-inline:hover{ color:var(--text); border-color:var(--text-dim); }
  .section-title{ font-size:16px; margin:20px 28px 12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; }
</style>
</head>

  var state = { tickets: [], lastSync: null, fileSha: null, users: [], usersSha: null, currentUser: null };
  var mode = null; // se define recién después del login
  var boardPollTimer = null;
  var adminPollTimer = null;
  var boardClockTimer = null;

  // ---------- helpers de codificación (texto con tildes/ñ <-> base64) ----------
  function utf8ToB64(str){ return btoa(unescape(encodeURIComponent(str))); }
  function b64ToUtf8(str){ return decodeURIComponent(escape(atob(str.split(String.fromCharCode(10)).join('')))); }

  // ---------- storage helpers (GitHub Contents API) ----------
  async function loadTickets(){
    try{
      var res = await fetch(GH_API, {
        headers: {
          'Authorization': 'Bearer ' + GH_TOKEN,
          'Accept': 'application/vnd.github+json'
        }
      });
      if(res.status === 404){
        // el archivo tickets.json todavía no existe en el repo
        state.tickets = [];
        state.fileSha = null;
        state.lastSync = new Date();
        return;
      }
      if(!res.ok){ throw new Error('HTTP ' + res.status); }
      var data = await res.json();
      state.fileSha = data.sha;
      var decoded = b64ToUtf8(data.content);
      state.tickets = decoded ? JSON.parse(decoded) : [];
    }catch(e){
      console.error('Error leyendo tickets de GitHub', e);
      state.tickets = state.tickets || [];
    }
    state.lastSync = new Date();
  }

  async function saveTicketsSafely(applyMutation){
    for(var attempt=0; attempt<3; attempt++){
      if(attempt > 0){ await loadTickets(); }
      applyMutation();
      var content = JSON.stringify(state.tickets, null, 2);
      var body = { message: 'Actualizar tickets \u2014 ' + new Date().toISOString(), content: utf8ToB64(content) };
      if(state.fileSha){ body.sha = state.fileSha; }
      try{
        var res = await fetch(GH_API, {
          method: 'PUT',
          headers: { 'Authorization': 'Bearer ' + GH_TOKEN, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if(res.ok){
          var data = await res.json();
          state.fileSha = data.content.sha;
          return true;
        }
        if(res.status === 409){ continue; }
        var errText = await res.text();
        throw new Error('HTTP ' + res.status + ' \u2014 ' + errText.slice(0,200));
      }catch(e){
        console.error('Error guardando tickets en GitHub', e);
        if(attempt === 2){
          var detail = (e && e.message) ? e.message : String(e);
          var NL = String.fromCharCode(10);
          alert('No se pudo guardar en GitHub.' + NL + NL + 'Detalle: ' + detail + NL + NL + 'El cambio qued\u00f3 visible en tu pantalla, pero puede no haberse sincronizado con la tablet.');
          return false;
        }
        await new Promise(function(r){ setTimeout(r, 700); });
      }
    }
    return false;
  }

  async function loadUsers(){
    try{
      var res = await fetch(GH_USERS_API, {
        headers: { 'Authorization': 'Bearer ' + GH_TOKEN, 'Accept': 'application/vnd.github+json' }
      });
      if(res.status === 404){ state.users = []; state.usersSha = null; return; }
      if(!res.ok){ throw new Error('HTTP ' + res.status); }
      var data = await res.json();
      state.usersSha = data.sha;
      var decoded = b64ToUtf8(data.content);
      state.users = decoded ? JSON.parse(decoded) : [];
    }catch(e){
      console.error('Error leyendo usuarios de GitHub', e);
      state.users = state.users || [];
    }
  }

  async function saveUsersSafely(applyMutation){
    for(var attempt=0; attempt<3; attempt++){
      if(attempt > 0){ await loadUsers(); }
      applyMutation();
      var content = JSON.stringify(state.users, null, 2);
      var body = { message: 'Actualizar usuarios \u2014 ' + new Date().toISOString(), content: utf8ToB64(content) };
      if(state.usersSha){ body.sha = state.usersSha; }
      try{
        var res = await fetch(GH_USERS_API, {
          method: 'PUT',
          headers: { 'Authorization': 'Bearer ' + GH_TOKEN, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if(res.ok){
          var data = await res.json();
          state.usersSha = data.content.sha;
          return true;
        }
        if(res.status === 409){ continue; }
        var errText = await res.text();
        throw new Error('HTTP ' + res.status + ' \u2014 ' + errText.slice(0,200));
      }catch(e){
        console.error('Error guardando usuarios en GitHub', e);
        if(attempt === 2){
          alert('No se pudo guardar el usuario. Prob\u00e1 de nuevo.');
          return false;
        }
        await new Promise(function(r){ setTimeout(r, 700); });
      }
    }
    return false;
  }

  function uid(){
    return 'tk_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  function effectiveRank(t){
    var base = PRIORITY_RANK[t.prioridad];
    var ageDays = (Date.now() - t.creado) / 86400000;
    var bonus = Math.floor(ageDays / 2);
    return Math.min(4, base + bonus);
  }

  function isEscalated(t){
    return effectiveRank(t) > PRIORITY_RANK[t.prioridad];
  }

  function sortedActive(){
    return state.tickets
      .filter(function(t){ return t.estado !== 'Terminada'; })
      .sort(function(a,b){
        var pr = effectiveRank(b) - effectiveRank(a);
        if(pr !== 0) return pr;
        return a.creado - b.creado;
      });
  }

  function doneToday(){
    var todayStr = new Date().toDateString();
    return state.tickets
      .filter(function(t){ return t.estado === 'Terminada' && t.terminadoEn && new Date(t.terminadoEn).toDateString() === todayStr; })
      .sort(function(a,b){ return b.terminadoEn - a.terminadoEn; });
  }

  function formatDateTime(ts){
    var d = new Date(ts);
    var datePart = d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit' });
    var timePart = d.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
    return datePart + ' ' + timePart;
  }

  function daysActive(t){
    return Math.floor((Date.now() - t.creado) / 86400000);
  }

  function elapsedLabel(ts){
    var mins = Math.floor((Date.now() - ts) / 60000);
    if(mins < 1) return 'recién creado';
    if(mins < 60) return 'hace ' + mins + ' min';
    var hrs = Math.floor(mins/60);
    var remMin = mins % 60;
    if(hrs < 24) return 'hace ' + hrs + 'h ' + remMin + 'm';
    var days = Math.floor(hrs/24);
    return 'hace ' + days + 'd';
  }

  function escapeHtml(str){
    var d = document.createElement('div');
    d.innerText = str || '';
    return d.innerHTML;
  }

  function renderBoardHeader(){
    var html = '';
    html += '<div class="board-header">';
    html += '  <img src="' + LOGO_B64 + '" alt="Logo" class="board-logo">';
    html += '  <div class="board-header-right">';
    html += '    <div class="board-nav"><label>Ir a</label><select id="boardNavSelect"><option value="tablero"' + (boardSection==='tablero'?' selected':'') + '>Tablero</option><option value="historial"' + (boardSection==='historial'?' selected':'') + '>Historial</option></select></div>';
    html += '    <a href="#" class="logout-link-inline" id="logoutLink">Cerrar sesi\u00f3n</a>';
    html += '  </div>';
    html += '</div>';
    return html;
  }

  function wireBoardHeader(){
    document.getElementById('logoutLink').onclick = function(e){ e.preventDefault(); logout(); };
    document.getElementById('boardNavSelect').onchange = function(){ boardSection = this.value; renderBoardSection(); };
  }

  function renderBoardSection(){
    if(boardSection === 'historial'){ renderHistorial(); } else { renderBoard(); }
  }

  function renderHistorial(){
    var app = document.getElementById('app');

    var html = renderBoardHeader();
    html += '<div class="board-main">';
    html += '<h2 class="section-title">Historial de \u00f3rdenes completadas</h2>';
    if(allDone.length === 0){
      html += '<div class="empty-state"><div class="big">\u2014</div>Todav\u00eda no hay \u00f3rdenes completadas.</div>';
    } else {
      html += '<div class="board-table-wrap"><table class="board-table"><thead><tr>';
      html += '<th class="col-bar"></th><th>Prioridad</th><th>Sector / M\u00e1quina</th><th>Tarea</th><th>Detalle</th><th>Creado por</th><th>Asignado a</th><th>Finalizado</th><th>Terminado por</th></tr></thead><tbody>';
      allDone.forEach(function(t){
        html += '<tr>';
        html += '<td class="col-bar" style="background:' + PRIORITY_COLOR[t.prioridad] + '"></td>';
        html += '<td><span class="badge" style="background:' + PRIORITY_COLOR[t.prioridad] + '22; color:' + PRIORITY_COLOR[t.prioridad] + '; border:1px solid ' + PRIORITY_COLOR[t.prioridad] + '">' + t.prioridad + '</span></td>';
        html += '<td class="sector-cell">' + escapeHtml(t.sector) + '</td>';
        html += '<td class="tarea-cell">' + escapeHtml(t.tarea) + '</td>';
        html += '<td class="detalle-cell">' + (t.detalle ? escapeHtml(t.detalle) : '\u2014') + '</td>';
        html += '<td class="creador-cell">' + (t.creadoPor ? escapeHtml(t.creadoPor) : '\u2014') + '</td>';
        html += '<td class="asignado-cell">' + (t.asignadoANombre ? escapeHtml(t.asignadoANombre) : 'Todos') + '</td>';
        html += '<td class="mono">' + formatDateTime(t.terminadoEn) + '</td>';
        html += '<td class="creador-cell">' + (t.terminadoPor ? escapeHtml(t.terminadoPor) : '\u2014') + '</td>';

  function renderBoard(){
    var app = document.getElementById('app');
    var allActive = sortedActive();
    var active = (boardFilterMine && state.currentUser) ? allActive.filter(function(t){ return t.asignadoA === state.currentUser.id; }) : allActive;
    var counts = { 'Urgente':0,'Alta':0,'Media':0,'Baja':0 };
    active.forEach(function(t){ counts[t.prioridad] = (counts[t.prioridad]||0) + 1; });

    var html = renderBoardHeader();
    html += '<div class="counts-strip">';
    ['Urgente','Alta','Media','Baja'].forEach(function(p){
      html += '<div class="count-pill"><span class="sw" style="background:' + PRIORITY_COLOR[p] + '"></span>' + p.toUpperCase() + ' <span class="count-num mono">' + counts[p] + '</span></div>';
    });
    html += '<button id="boardFilterToggle" class="filter-toggle-btn' + (boardFilterMine ? ' active' : '') + '">' + (boardFilterMine ? '\u2713 Solo mis tareas' : 'Ver solo mis tareas') + '</button>';
    html += '</div>';

    html += '<div class="board-main">';
    if(active.length === 0){
      html += '<div class="empty-state"><div class="big">\u2713</div>Sin tareas pendientes en este momento.</div>';
    } else {
      html += '<div class="board-table-wrap"><table class="board-table"><thead><tr>';
      html += '<th class="col-bar"></th><th>Prioridad</th><th>Sector / M\u00e1quina</th><th>Tarea</th><th>Detalle</th><th>Creado por</th><th>Asignado a</th><th>Estado</th><th>Activado</th><th>Acciones</th>';
      html += '</tr></thead><tbody>';
      active.forEach(function(t){
        var dias = daysActive(t);
        html += '<tr>';
        html += '<td class="col-bar" style="background:' + PRIORITY_COLOR[t.prioridad] + '"></td>';
        html += '<td><span class="badge" style="background:' + PRIORITY_COLOR[t.prioridad] + '22; color:' + PRIORITY_COLOR[t.prioridad] + '; border:1px solid ' + PRIORITY_COLOR[t.prioridad] + '">' + t.prioridad + '</span></td>';
        html += '<td class="sector-cell">' + escapeHtml(t.sector) + '</td>';
        html += '<td class="tarea-cell">' + escapeHtml(t.tarea) + '</td>';
        html += '<td class="detalle-cell">' + (t.detalle ? escapeHtml(t.detalle) : '\u2014') + '</td>';
        html += '<td class="creador-cell">' + (t.creadoPor ? escapeHtml(t.creadoPor) : '\u2014') + '</td>';
        html += '<td class="asignado-cell">' + (t.asignadoANombre ? escapeHtml(t.asignadoANombre) : 'Todos') + '</td>';
        var estadoTitle = (t.estado === 'En curso' && t.iniciadoPor) ? ' title="Iniciado por ' + escapeHtml(t.iniciadoPor) + '"' : '';
        html += '<td><span class="badge"' + estadoTitle + ' style="background:' + ESTADO_COLOR[t.estado] + '22; color:' + ESTADO_COLOR[t.estado] + '; border:1px solid ' + ESTADO_COLOR[t.estado] + '">' + t.estado + '</span></td>';
        html += '<td class="activado-cell"><div class="activado-fecha mono">' + formatDateTime(t.creado) + '</div><div class="activado-dias">' + dias + (dias === 1 ? ' d\u00eda activo' : ' d\u00edas activo' + (dias===1?'':'s')) + (isEscalated(t) ? " \u23eb" : '') + '</div></td>';
        html += '<td class="actions-cell">';
        if(t.estado === 'Pendiente'){ html += '<button class="board-btn board-btn-start" data-action="iniciar" data-id="' + t.id + '">Comenzar</button>'; }
        if(t.estado === 'En curso'){ html += '<button class="board-btn board-btn-pause" data-action="pausar" data-id="' + t.id + '">Pausar</button>'; }
        if(t.estado === 'Pausada'){ html += '<button class="board-btn board-btn-resume" data-action="reanudar" data-id="' + t.id + '">Reanudar</button>'; }
        html += '<button class="board-btn board-btn-done" data-action="terminar" data-id="' + t.id + '">Terminar</button>';
        html += '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }

    var allDone = doneToday();
    var done = (boardFilterMine && state.currentUser) ? allDone.filter(function(t){ return t.asignadoA === state.currentUser.id; }) : allDone;
    if(done.length){
      html += '<div class="done-strip"><h3>Completadas hoy</h3>';
      html += '<div class="board-table-wrap"><table class="board-table board-table-compact"><thead><tr><th>Sector / M\u00e1quina</th><th>Tarea</th><th>Asignado a</th><th>Finalizado</th><th>Por</th></tr></thead><tbody>';
      done.slice(0,6).forEach(function(t){
        html += '<tr><td class="sector-cell">' + escapeHtml(t.sector) + '</td><td class="tarea-cell">' + escapeHtml(t.tarea) + '</td><td class="asignado-cell">' + (t.asignadoANombre ? escapeHtml(t.asignadoANombre) : 'Todos') + '</td><td class="mono">' + formatDateTime(t.terminadoEn) + '</td><td class="detalle-cell">' + (t.terminadoPor ? escapeHtml(t.terminadoPor) : '') + '</td></tr>';
      });
      html += '</tbody></table></div></div>';
    }
    html += '</div>';

    html += '<div class="sync-note mono" id="syncNote"></div>';
    html += '<a href="#" class="logout-link" id="logoutLink">Cerrar sesi\u00f3n</a>';

    app.innerHTML = html;
    updateSyncNote();
    wireBoardHeader();
    document.getElementById('boardFilterToggle').onclick = function(){ boardFilterMine = !boardFilterMine; renderBoard(); };
    app.querySelectorAll('.board-btn').forEach(function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute('data-id');
        var action = btn.getAttribute('data-action');
        if(action === 'iniciar'){ updateTicket(id, 'estado', 'En curso'); }
        else if(action === 'pausar'){ updateTicket(id, 'estado', 'Pausada'); }
        else if(action === 'reanudar'){ updateTicket(id, 'estado', 'En curso'); }
        else if(action === 'terminar'){ if(confirm('\u00bfMarcar esta tarea como Terminada?')){ updateTicket(id, 'estado', 'Terminada'); } }
      };
    });
  }

  function updateSyncNote(){
    var el = document.getElementById('syncNote');
    if(!el || !state.lastSync) return;
    var secs = Math.floor((Date.now() - state.lastSync.getTime())/1000);
    el.textContent = 'Actualizado hace ' + secs + 's';
  }

  function refreshAdminLists(){
    if(!adminShellBuilt) return;
    var active = sortedActive();
    var done = doneToday();
    document.getElementById('activeCount').textContent = active.length;
    document.getElementById('doneCount').textContent = done.length;
    renderAdminList('activeList', active, false);
    renderAdminList('doneList', done, true);
  }

  function renderAdmin(){
    if(!adminShellBuilt){ buildAdminShell(); }
    refreshAdminLists();
    refreshUserList();
  }

  function renderAdminList(containerId, list, isDone){
    var el = document.getElementById(containerId);
    if(list.length === 0){
      el.innerHTML = '<div style="color:var(--text-dim); font-size:14px;">Nada para mostrar.</div>';
      return;
    }
    var html = '';
    list.forEach(function(t){
      if(editingTicketId === t.id){
        html += '<div class="admin-ticket admin-ticket-editing">';
        html += '  <div class="bar" style="background:' + PRIORITY_COLOR[t.prioridad] + '"></div>';
        html += '  <div class="admin-ticket-editform">';
        html += '    <input type="text" class="edit-sector" value="' + escapeHtml(t.sector) + '" placeholder="Sector / M\u00e1quina">';
        html += '    <input type="text" class="edit-tarea" value="' + escapeHtml(t.tarea) + '" placeholder="Tarea">';
        html += '    <textarea class="edit-detalle" placeholder="Detalle (opcional)">' + escapeHtml(t.detalle||'') + '</textarea>';
        html += '  </div>';
        html += '  <div class="admin-controls">';
        html += '    <button class="icon-btn icon-btn-save" data-save="' + t.id + '">Guardar</button>';
        html += '    <button class="icon-btn" data-cancel="' + t.id + '">Cancelar</button>';
        html += '  </div>';
        html += '</div>';
        return;
      }
      html += '<div class="admin-ticket">';
      html += '  <div class="bar" style="background:' + PRIORITY_COLOR[t.prioridad] + '"></div>';
      var attrib = '';
      if(t.estado === 'En curso' && t.iniciadoPor){ attrib = ' \u00b7 iniciado por ' + escapeHtml(t.iniciadoPor); }
      if(t.estado === 'Pausada'){ attrib = ' \u00b7 pausada' + (t.iniciadoPor ? ' (iniciada por ' + escapeHtml(t.iniciadoPor) + ')' : ''); }
      if(t.estado === 'Terminada' && t.terminadoPor){ attrib = ' \u00b7 terminado por ' + escapeHtml(t.terminadoPor); }
      var asigLabel = t.asignadoANombre ? ' \u00b7 asignado a ' + escapeHtml(t.asignadoANombre) : ' \u00b7 sin asignar';
      var creadorLabel = t.creadoPor ? ' \u00b7 creado por ' + escapeHtml(t.creadoPor) : '';
      html += '  <div class="admin-ticket-info"><div class="t">' + escapeHtml(t.sector) + ' \u2014 ' + escapeHtml(t.tarea) + '</div><div class="s">' + elapsedLabel(t.creado) + (isEscalated(t) ? " \u23eb" : '') + (t.detalle ? ' \u00b7 ' + escapeHtml(t.detalle) : '') + creadorLabel + attrib + asigLabel + '</div></div>';
      html += '  <div class="admin-controls">';
      if(!isDone){
        html += '    <select data-id="' + t.id + '" data-field="prioridad" class="sel-field">';
        ['Urgente','Alta','Media','Baja'].forEach(function(p){ html += '<option' + (p===t.prioridad?' selected':'') + '>' + p + '</option>'; });
        html += '    </select>';
        html += '    <select data-id="' + t.id + '" data-field="estado" class="sel-field">';
        ['Pendiente','En curso','Pausada','Terminada'].forEach(function(e2){ html += '<option' + (e2===t.estado?' selected':'') + '>' + e2 + '</option>'; });
        html += '    </select>';
      }
      html += '    <button class="icon-btn" data-edit="' + t.id + '">Editar</button>';
      html += '    <button class="icon-btn" data-del="' + t.id + '">Eliminar</button>';
      html += '  </div>';
      html += '</div>';
    });
    el.innerHTML = html;

    el.querySelectorAll('.sel-field').forEach(function(sel){
      sel.onchange = function(){
        var id = sel.getAttribute('data-id');
        var field = sel.getAttribute('data-field');
        updateTicket(id, field, sel.value);
      };
    });
    el.querySelectorAll('[data-edit]').forEach(function(btn){
      btn.onclick = function(){ editingTicketId = btn.getAttribute('data-edit'); refreshAdminLists(); };
    });
    el.querySelectorAll('[data-cancel]').forEach(function(btn){
      btn.onclick = function(){ editingTicketId = null; refreshAdminLists(); };
    });
    el.querySelectorAll('[data-save]').forEach(function(btn){
      btn.onclick = async function(){
        var id = btn.getAttribute('data-save');
        var card = btn.closest('.admin-ticket');
        var sector = card.querySelector('.edit-sector').value.trim();
        var tarea = card.querySelector('.edit-tarea').value.trim();
        var detalle = card.querySelector('.edit-detalle').value.trim();
        if(!sector || !tarea){ alert('Sector/M\u00e1quina y Tarea no pueden quedar vac\u00edos.'); return; }
        btn.disabled = true; btn.textContent = 'Guardando...';
        await saveTicketsSafely(function(){
          var t = state.tickets.find(function(x){ return x.id === id; });
          if(t){ t.sector = sector; t.tarea = tarea; t.detalle = detalle; }
        });
        editingTicketId = null;
        refreshAdminLists();
      };
    });
    el.querySelectorAll('[data-del]').forEach(function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute('data-del');
        if(confirm('\u00bfEliminar este ticket definitivamente?')){
          deleteTicket(id);
        }
      };
    });
  }

  async function handleAddUser(){
    var nombre = document.getElementById('u_nombre').value.trim();
    var rol = document.getElementById('u_rol').value;
    var usuario = document.getElementById('u_usuario').value.trim();
    var clave = document.getElementById('u_clave').value.trim();
    if(!nombre || !usuario || !clave){ alert('Complet\u00e1 nombre, usuario y clave.'); return; }
    if(state.users.some(function(u){ return u.usuario === usuario; })){ alert('Ese usuario ya existe, eleg\u00ed otro.'); return; }
    var btn = document.getElementById('btnAddUser');
    btn.disabled = true; btn.textContent = 'Guardando...';
    var newUser = { id: 'u_' + Date.now().toString(36), nombre: nombre, usuario: usuario, clave: clave, rol: rol, activo: true };
    await saveUsersSafely(function(){ state.users.push(newUser); });
    document.getElementById('u_nombre').value = '';
    document.getElementById('u_usuario').value = '';
    document.getElementById('u_clave').value = '';
    btn.disabled = false; btn.textContent = 'Crear usuario';
    refreshUserList();
  }

  function refreshUserList(){
    refreshAssignSelect();
    var countEl = document.getElementById('userCount');
    if(!countEl) return;
    countEl.textContent = state.users.filter(function(u){ return u.activo !== false; }).length;
    renderUserList();
  }

  function renderUserList(){
    var el = document.getElementById('userList');
    if(!el) return;
    if(state.users.length === 0){ el.innerHTML = '<div style="color:var(--text-dim); font-size:14px;">Nada para mostrar.</div>'; return; }
    var html = '';
    state.users.forEach(function(u){
      var isMe = state.currentUser && state.currentUser.usuario === u.usuario;
      if(editingUserId === u.id){
        html += '<div class="admin-ticket admin-ticket-editing">';
        html += '  <div class="bar" style="background:' + (u.rol === 'admin' ? 'var(--accent)' : 'var(--baja)') + '"></div>';
        html += '  <div class="admin-ticket-editform">';
        html += '    <input type="text" class="edit-u-nombre" value="' + escapeHtml(u.nombre) + '" placeholder="Nombre">';
        html += '    <input type="text" class="edit-u-usuario" value="' + escapeHtml(u.usuario) + '" placeholder="Usuario">';
        html += '    <input type="text" class="edit-u-clave" value="' + escapeHtml(u.clave) + '" placeholder="Clave">';
        html += '    <select class="edit-u-rol"><option value="operario"' + (u.rol==='operario'?' selected':'') + '>Operario</option><option value="admin"' + (u.rol==='admin'?' selected':'') + '>Supervisor</option></select>';
        html += '  </div>';
        html += '  <div class="admin-controls">';
        html += '    <button class="icon-btn icon-btn-save" data-usersave="' + u.id + '">Guardar</button>';
        html += '    <button class="icon-btn" data-usercancel="' + u.id + '">Cancelar</button>';
        html += '  </div>';
        html += '</div>';
        return;
      }
      html += '<div class="admin-ticket">';
      html += '  <div class="bar" style="background:' + (u.rol === 'admin' ? 'var(--accent)' : 'var(--baja)') + '"></div>';
      html += '  <div class="admin-ticket-info"><div class="t">' + escapeHtml(u.nombre) + ' (' + escapeHtml(u.usuario) + ')' + (isMe ? ' \u2014 vos' : '') + '</div><div class="s">' + (u.rol === 'admin' ? 'Supervisor' : 'Operario') + (u.activo === false ? ' \u00b7 inactivo' : '') + '</div></div>';
      html += '  <div class="admin-controls">';
      html += '    <button class="icon-btn" data-useredit="' + u.id + '">Editar</button>';
      if(!isMe){
        html += '    <button class="icon-btn" data-toggleuser="' + u.id + '">' + (u.activo === false ? 'Activar' : 'Desactivar') + '</button>';
        html += '    <button class="icon-btn" data-deluser="' + u.id + '">Eliminar</button>';
      }
      html += '  </div>';
      html += '</div>';
    });
    el.innerHTML = html;

    el.querySelectorAll('[data-useredit]').forEach(function(btn){
      btn.onclick = function(){ editingUserId = btn.getAttribute('data-useredit'); refreshUserList(); };
    });
    el.querySelectorAll('[data-usercancel]').forEach(function(btn){
      btn.onclick = function(){ editingUserId = null; refreshUserList(); };
    });
    el.querySelectorAll('[data-usersave]').forEach(function(btn){
      btn.onclick = async function(){
        var id = btn.getAttribute('data-usersave');
        var card = btn.closest('.admin-ticket');
        var nombre = card.querySelector('.edit-u-nombre').value.trim();
        var usuario = card.querySelector('.edit-u-usuario').value.trim();
        var clave = card.querySelector('.edit-u-clave').value.trim();
        var rol = card.querySelector('.edit-u-rol').value;
        if(!nombre || !usuario || !clave){ alert('Complet\u00e1 nombre, usuario y clave.'); return; }
        if(state.users.some(function(x){ return x.usuario === usuario && x.id !== id; })){ alert('Ese usuario ya existe, eleg\u00ed otro.'); return; }
        btn.disabled = true; btn.textContent = 'Guardando...';
        await saveUsersSafely(function(){
          var u = state.users.find(function(x){ return x.id === id; });
          if(u){ u.nombre = nombre; u.usuario = usuario; u.clave = clave; u.rol = rol; }
        });
        var updated = state.users.find(function(x){ return x.id === id; });
        if(state.currentUser && state.currentUser.id === id){ state.currentUser = updated; }
        editingUserId = null;
        refreshUserList();
      };
    });
    el.querySelectorAll('[data-toggleuser]').forEach(function(btn){
      btn.onclick = async function(){
        var id = btn.getAttribute('data-toggleuser');
        await saveUsersSafely(function(){
          var u = state.users.find(function(x){ return x.id === id; });
          if(u){ u.activo = (u.activo === false) ? true : false; }
        });
        refreshUserList();
      };
    });
    el.querySelectorAll('[data-deluser]').forEach(function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute('data-deluser');
        if(confirm('\u00bfEliminar este usuario definitivamente?')){
          saveUsersSafely(function(){
            state.users = state.users.filter(function(x){ return x.id !== id; });
          }).then(refreshUserList);
        }
      };
    });
  }

  function refreshAssignSelect(){
    var sel = document.getElementById('f_asignado');
    if(!sel) return;
    var current = sel.value;
    var html = '<option value="">Sin asignar (todos)</option>';
    state.users.filter(function(u){ return u.rol === 'operario' && u.activo !== false; }).forEach(function(u){
      html += '<option value="' + u.id + '">' + escapeHtml(u.nombre) + '</option>';
    });
    sel.innerHTML = html;
    if(state.users.some(function(u){ return u.id === current; })){ sel.value = current; }
  }

  async function handleAdd(){
    var sector = document.getElementById('f_sector').value.trim();
    var tarea = document.getElementById('f_tarea').value.trim();
    var detalle = document.getElementById('f_detalle').value.trim();
    var prioridad = document.getElementById('f_prioridad').value;
    var asignadoId = document.getElementById('f_asignado').value;
    var asignadoUser = asignadoId ? state.users.find(function(u){ return u.id === asignadoId; }) : null;
    if(!sector || !tarea){
      alert('Complet\u00e1 al menos Sector/M\u00e1quina y Tarea.');
      return;
    }
    var btn = document.getElementById('btnAdd');
    btn.disabled = true; btn.textContent = 'Guardando...';
    var newTicket = {
      id: uid(), sector: sector, tarea: tarea, detalle: detalle,
      prioridad: prioridad, estado: 'Pendiente', creado: Date.now(), iniciadoEn: null, terminadoEn: null, pausadoEn: null,
      creadoPor: (state.currentUser ? state.currentUser.nombre : ''), iniciadoPor: null, terminadoPor: null,
      asignadoA: asignadoId || null, asignadoANombre: asignadoUser ? asignadoUser.nombre : null
    };
    await saveTicketsSafely(function(){ state.tickets.push(newTicket); });
    document.getElementById('f_sector').value = '';
    document.getElementById('f_tarea').value = '';
    document.getElementById('f_detalle').value = '';
    document.getElementById('f_prioridad').value = 'Media';
    document.getElementById('f_asignado').value = '';
    btn.disabled = false; btn.textContent = 'Crear ticket';
    refreshAdminLists();
  }

  async function updateTicket(id, field, value){
    await saveTicketsSafely(function(){
      var t = state.tickets.find(function(x){ return x.id === id; });
      if(!t) return;
      t[field] = value;
      if(field === 'estado' && value === 'Terminada'){ t.terminadoEn = Date.now(); t.terminadoPor = state.currentUser ? state.currentUser.nombre : ''; }
      if(field === 'estado' && value === 'En curso'){
        if(!t.iniciadoEn){ t.iniciadoEn = Date.now(); }
        t.iniciadoPor = state.currentUser ? state.currentUser.nombre : '';
      }
      if(field === 'estado' && value === 'Pausada'){ t.pausadoEn = Date.now(); }
      if(field === 'estado' && value === 'Pendiente'){ t.terminadoEn = null; }
    });
    if(mode === 'admin'){ refreshAdminLists(); } else { renderBoardSection(); }
  }

  async function deleteTicket(id){
    await saveTicketsSafely(function(){
      state.tickets = state.tickets.filter(function(x){ return x.id !== id; });
    });
    refreshAdminLists();
  }

  function renderLogin(errorMsg){
    var app = document.getElementById('app');
    var html = '';
    html += '<div class="login-wrap"><div class="login-card">';
    html += '  <div class="login-dot"></div>';
    html += '  <h1 class="display">Tickets — Sector Moldeo</h1>';
    html += '  <div class="sub">Ingresá con tu usuario para continuar</div>';
    html += '  <div class="login-error">' + (errorMsg ? escapeHtml(errorMsg) : '') + '</div>';
    html += '  <label>Usuario</label><input type="text" id="l_user" autocomplete="username">';
    html += '  <label>Contraseña</label><input type="password" id="l_pass" autocomplete="current-password">';
    html += '  <button class="btn btn-primary" id="btnLogin">Ingresar</button>';
    html += '</div></div>';
    app.innerHTML = html;

    document.getElementById('btnLogin').onclick = handleLogin;
    document.getElementById('l_pass').addEventListener('keydown', function(e){
      if(e.key === 'Enter') handleLogin();
    });
    document.getElementById('l_user').focus();
  }

  async function handleLogin(){
    var user = document.getElementById('l_user').value.trim();
    var pass = document.getElementById('l_pass').value;
    var btn = document.getElementById('btnLogin');
    btn.disabled = true; btn.textContent = 'Verificando...';

    await loadUsers();
    var found = state.users.find(function(u){ return u.usuario === user && u.clave === pass && u.activo !== false; });

    if(found){
      state.currentUser = found;
      await enterMode(found.rol === 'admin' ? 'admin' : 'board');
    } else {
      btn.disabled = false; btn.textContent = 'Ingresar';
      renderLogin('Usuario o contraseña incorrectos.');
    }
  }

  function logout(){
    if(boardPollTimer){ clearInterval(boardPollTimer); boardPollTimer = null; }
    if(boardClockTimer){ clearInterval(boardClockTimer); boardClockTimer = null; }
    if(adminPollTimer){ clearInterval(adminPollTimer); adminPollTimer = null; }
    adminShellBuilt = false;
    mode = null;
    state.currentUser = null;
    renderLogin();
  }

  async function boardRefreshFromStorage(){
    await loadTickets();
    renderBoardSection();
  }

  async function adminRefreshFromStorage(){
    await loadTickets();
    refreshAdminLists();
  }

  async function enterMode(newMode){
    mode = newMode;
    await loadTickets();

    if(mode === 'admin'){
      renderAdmin();
      adminPollTimer = setInterval(adminRefreshFromStorage, 20000);
    } else {
      renderBoardSection();
      boardPollTimer = setInterval(boardRefreshFromStorage, 45000);
      boardClockTimer = setInterval(function(){
        var syncEl = document.getElementById('syncNote');
        if(syncEl) updateSyncNote();
        renderBoardSection();
      }, 15000);
    }
  }

  function init(){
    renderLogin();
  }

  init();
})();
</script>
</body>
</html>
